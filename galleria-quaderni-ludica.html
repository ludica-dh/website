<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quaderni del LUDiCa</title>
  <style>
    /* =============================================================
       PERSONALIZZAZIONE DEI TESTI: modifica i valori qui sotto.

       Font: puoi scrivere, per esempio, Georgia, serif oppure
       'Times New Roman', serif. Un font non installato sul dispositivo
       richiede di essere caricato separatamente (es. con @font-face).

       Dimensioni: aumenta o diminuisci il numero prima di px:
       26px -> 30px rende più grandi i titoli delle schede.
       Le modifiche qui valgono sia su computer sia su telefono.
       ============================================================= */
    :root {
      --font-titoli: Arial, Helvetica, sans-serif;   /* titolo di ogni quaderno */
      --font-sinossi: Arial, Helvetica, sans-serif;  /* testo descrittivo */
      --font-pulsanti: Arial, Helvetica, sans-serif; /* pulsante Leggi il PDF */

      --dimensione-titoli: 26px;
      --dimensione-sinossi: 14px;
      --dimensione-pulsanti: 13px;

      --colore-testo: #171717; /* colore dei titoli e delle sinossi */
      color-scheme: light;
      font-family: var(--font-sinossi);
      color: var(--colore-testo);
      background: #fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .catalogo { max-width: 1260px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 46px) 56px; }
    .griglia { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch; gap: 38px; }
    .scheda { display: flex; flex-direction: column; min-width: 0; overflow: hidden; border: 1px solid #dedede; border-radius: 13px; background: white; }
    .copertina { display: block; aspect-ratio: 0.77; overflow: hidden; background: #f7f7f7; }
    .copertina img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .copertina-vuota { display: grid; place-items: center; padding: 24px; color: #656565; text-align: center; font-size: 1rem; }
    .contenuto { display: flex; flex: 1; flex-direction: column; padding: 21px 22px 25px; }
    .titolo { margin: 0 0 19px; font-family: var(--font-titoli); font-size: var(--dimensione-titoli); line-height: 1.25; font-weight: 700; }
    .sinossi { margin: 0; font-family: var(--font-sinossi); font-size: var(--dimensione-sinossi); line-height: 1.56; white-space: pre-line; overflow-wrap: anywhere; }
    .azioni { margin-top: auto; padding-top: 25px; }
    .pdf { display: inline-block; border: 1px solid #191919; border-radius: 5px; padding: 11px 15px; color: #191919; font-family: var(--font-pulsanti); font-weight: 700; font-size: var(--dimensione-pulsanti); text-decoration: none; }
    .pdf:hover, .pdf:focus-visible { color: white; background: #191919; }
    .messaggio { margin: 20px 0; color: #404040; font-size: 1rem; line-height: 1.5; }
    .messaggio.errore { color: #8a2424; }
    @media (max-width: 900px) { .griglia { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; } }
    @media (max-width: 570px) { .catalogo { padding: 16px 15px 40px; } .griglia { grid-template-columns: 1fr; gap: 20px; } .contenuto { padding: 18px; } }
  </style>
</head>
<body>
  <main class="catalogo" aria-label="Quaderni del LUDiCa">
    <p id="stato" class="messaggio" role="status">Caricamento dei quaderni…</p>
    <div id="griglia" class="griglia" aria-live="polite"></div>
  </main>
  <script>
    // Per usare un altro foglio, modifica soltanto questo URL. Il foglio deve essere pubblicato come CSV.
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRnbHCs4ZDmMDJYRyP5vbQ4iY97UKBfe-_THwDbICkgeHy7plN96vXHZXzi1mvWsW5dtZBY1nfoN0sI/pub?gid=255697261&single=true&output=csv';

    const griglia = document.getElementById('griglia');
    const stato = document.getElementById('stato');

    // Comunica a WordPress l'altezza effettiva della pagina incorporata.
    function comunicaAltezza() {
      const altezza = Math.ceil(Math.max(document.body.scrollHeight, document.documentElement.scrollHeight));
      window.parent.postMessage({ tipo: 'ludica-quaderni:altezza', altezza }, '*');
    }
    new ResizeObserver(comunicaAltezza).observe(document.body);
    window.addEventListener('load', comunicaAltezza);
    document.fonts?.ready.then(comunicaAltezza);

    // Gestisce virgolette, virgole nei testi e ritorni a capo dentro una cella del CSV.
    function leggiCSV(testo) {
      const righe = [];
      let riga = [], campo = '', traVirgolette = false;
      testo = testo.replace(/^\uFEFF/, '');
      for (let i = 0; i < testo.length; i++) {
        const carattere = testo[i];
        if (carattere === '"') {
          if (traVirgolette && testo[i + 1] === '"') { campo += '"'; i++; }
          else traVirgolette = !traVirgolette;
        } else if (carattere === ',' && !traVirgolette) {
          riga.push(campo); campo = '';
        } else if ((carattere === '\n' || carattere === '\r') && !traVirgolette) {
          if (carattere === '\r' && testo[i + 1] === '\n') i++;
          riga.push(campo); campo = '';
          if (riga.some(cella => cella.trim())) righe.push(riga);
          riga = [];
        } else campo += carattere;
      }
      riga.push(campo);
      if (riga.some(cella => cella.trim())) righe.push(riga);
      return righe;
    }

    function intestazione(valore) {
      return valore.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
    }

    function indirizzo(valore) {
      try {
        const url = new URL((valore || '').trim());
        return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
      } catch { return ''; }
    }

    // I link di condivisione di Google Drive possono essere usati anche come copertine.
    function immagineDaDrive(valore) {
      const url = indirizzo(valore);
      if (!url) return '';
      const u = new URL(url);
      if (!['drive.google.com', 'docs.google.com'].includes(u.hostname)) return url;
      const id = u.pathname.match(/\/file\/d\/([\w-]+)/)?.[1] || u.searchParams.get('id');
      return id ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1200` : url;
    }

    function creaScheda(record) {
      const articolo = document.createElement('article');
      articolo.className = 'scheda';
      const copertina = document.createElement(record.pdf ? 'a' : 'div');
      copertina.className = 'copertina';
      if (record.pdf) {
        copertina.href = record.pdf;
        copertina.target = '_blank';
        copertina.rel = 'noopener noreferrer';
        copertina.setAttribute('aria-label', `Apri il PDF: ${record.titolo}`);
      }
      if (record.immagine) {
        const img = document.createElement('img');
        img.src = record.immagine;
        img.alt = `Copertina di ${record.titolo}`;
        img.loading = 'lazy';
        img.onerror = () => { copertina.replaceChildren(); copertina.classList.add('copertina-vuota'); copertina.textContent = 'Copertina non disponibile'; };
        copertina.append(img);
      } else {
        copertina.classList.add('copertina-vuota');
        copertina.textContent = 'Copertina non disponibile';
      }
      const contenuto = document.createElement('div');
      contenuto.className = 'contenuto';
      const titolo = document.createElement('h2');
      titolo.className = 'titolo';
      titolo.textContent = record.titolo;
      contenuto.append(titolo);
      if (record.sinossi) {
        const sinossi = document.createElement('p');
        sinossi.className = 'sinossi';
        sinossi.textContent = record.sinossi;
        contenuto.append(sinossi);
      }
      if (record.pdf) {
        const azioni = document.createElement('div');
        azioni.className = 'azioni';
        const collegamento = document.createElement('a');
        collegamento.className = 'pdf';
        collegamento.href = record.pdf;
        collegamento.target = '_blank';
        collegamento.rel = 'noopener noreferrer';
        collegamento.textContent = 'Leggi il PDF';
        azioni.append(collegamento);
        contenuto.append(azioni);
      }
      articolo.append(copertina, contenuto);
      return articolo;
    }

    async function avvia() {
      try {
        const risposta = await fetch(CSV_URL, { cache: 'no-store' });
        if (!risposta.ok) throw new Error(`HTTP ${risposta.status}`);
        const righe = leggiCSV(await risposta.text());
        if (!righe.length) throw new Error('CSV vuoto');
        const colonne = righe.shift().map(intestazione);
        const nomi = ['titolo', 'sinossi', 'url immagine copertina', 'url pdf'];
        if (nomi.some(nome => !colonne.includes(nome))) throw new Error('Intestazioni CSV non corrispondenti');
        const indice = nome => colonne.indexOf(nome);
        const schede = righe.map(riga => ({
          titolo: (riga[indice('titolo')] || '').trim(),
          sinossi: (riga[indice('sinossi')] || '').trim(),
          immagine: immagineDaDrive(riga[indice('url immagine copertina')]),
          pdf: indirizzo(riga[indice('url pdf')])
        })).filter(scheda => scheda.titolo);
        if (!schede.length) { stato.textContent = 'Nessun quaderno disponibile.'; return; }
        griglia.replaceChildren(...schede.map(creaScheda));
        stato.hidden = true;
        comunicaAltezza();
      } catch (errore) {
        console.error('Impossibile caricare i quaderni:', errore);
        stato.classList.add('errore');
        stato.textContent = 'Non è stato possibile caricare i quaderni. Controlla che il foglio Google sia pubblicato sul Web come CSV e che le intestazioni delle colonne siano corrette.';
        comunicaAltezza();
      }
    }
    avvia();
  </script>
</body>
</html>
