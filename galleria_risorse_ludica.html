<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Galleria risorse LUDiCa</title>
  <style>

    /* =============================================================
       1. PERSONALIZZAZIONE — modifica i valori in questa sezione.
       Ogni tipologia di testo ha dimensione e colore indipendenti.
       ============================================================= */
    .ludica-risorse {
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      /* SFONDI: pagina, intestazione, pannello filtri, schede e messaggi. */
      --sfondo-pagina: #faf9fc;
      --sfondo-intestazione: transparent;
      --sfondo-strumenti: #ffffff;
      --sfondo-scheda: #ffffff;
      --sfondo-messaggi: #f4effb;
      --colore-bordo: #e7e2ee;
      --colore-focus: #7928ca;

      /* TESTI: dimensioni e colori per ogni tipologia. */
      --testo-base: 16px;
      --colore-base: #252333;
      --testo-titolo-pagina: clamp(28px, 4vw, 40px);
      --colore-titolo-pagina: #252333;
      --testo-introduzione: 16px;
      --colore-introduzione: #6a6578;
      --testo-etichetta: 13px;
      --colore-etichetta: #514b61;
      --testo-ricerca: 16px;
      --colore-ricerca: #252333;
      --colore-segnaposto: #80798c;
      --testo-filtri: 14px;
      --colore-filtri: #514b61;
      --colore-filtri-hover: #6424a9;
      --colore-filtri-attivi: #ffffff;
      --testo-conteggio: 14px;
      --colore-conteggio: #746d81;
      --testo-titolo-scheda: 20px;
      --colore-titolo-scheda: #7025bb;
      --testo-descrizione: 15px;
      --colore-descrizione: #625b70;
      --testo-badge: 11px;
      --colore-badge: #6926a9;
      --testo-pulsante: 14px;
      --colore-pulsante: #ffffff;
      --colore-pulsante-hover: #ffffff;
      --colore-link-assente: #746d81;
      --testo-messaggi: 16px;
      --colore-messaggi: #514b61;
      --testo-riprova: 14px;
      --colore-riprova: #6424a9;

      /* CATEGORIE: sfondi, bordi, angoli e spazi interni. */
      --sfondo-filtri: #faf9fc;
      --sfondo-filtri-hover: #f1e9fc;
      --sfondo-filtri-attivi: #7928ca;
      --bordo-filtri: #e8e3ee;
      --bordo-filtri-hover: #d5bbed;
      --bordo-filtri-attivi: #7928ca;
      --raggio-filtri: 12px;
      --padding-filtri: 11px 18px;

      /* RICERCA E PULSANTI DELLE SCHEDE. */
      --sfondo-ricerca: #faf9fc;
      --sfondo-pulsante: #7928ca;
      --sfondo-pulsante-hover: #5b21a2;
      --sfondo-badge: #f3ecfc;
      --sfondo-riprova: #ffffff;
      --sfondo-riprova-hover: #f1e9fc;

      /* ANTEPRIMA: occupa tutta la larghezza interna della scheda.
         Altezza precedente: 72px. Nuova altezza: 210px.
         contain = immagine intera, ideale per loghi.
         cover = riempie il riquadro, può ritagliare l'immagine.
         --larghezza-anteprima può essere 100% oppure un valore in px.
         Per allinearla a sinistra: --allineamento-anteprima: flex-start. */
      --larghezza-anteprima: 100%;
      --altezza-anteprima: 210px;
      --sfondo-anteprima: #f6f3fa;
      --raggio-anteprima: 12px;
      --bordo-anteprima: #eee7f5;
      --padding-immagine: 18px;
      --adattamento-immagine: contain;
      --posizione-immagine: center;
      --allineamento-anteprima: center;
      --testo-icona-riserva: 60px;
      --colore-icona-riserva: #7928ca;

      /* LAYOUT: larghezza, spazi, angoli e ombre. */
      --larghezza-massima: 1440px;
      --spazio-griglia: 24px;
      --padding-pagina: clamp(16px, 3vw, 40px);
      --padding-strumenti: clamp(16px, 2vw, 24px);
      --padding-scheda: 22px;
      --raggio-scheda: 18px;
      --ombra-scheda: 0 4px 20px rgb(35 20 60 / 4%);
      --ombra-scheda-hover: 0 14px 32px rgb(35 20 60 / 9%);
      --ombra-filtri: 0 2px 4px rgb(35 20 60 / 3%);
      --ombra-filtri-hover: 0 4px 10px rgb(35 20 60 / 7%);
      --ombra-filtri-attivi: 0 4px 12px rgb(121 40 202 / 17%);

      width: 100%; min-width: 0; margin: 0; padding: 0;
      color: var(--colore-base); background: var(--sfondo-pagina);
      font: 400 var(--testo-base)/1.6 var(--font); text-align: left;
      color-scheme: light; -webkit-text-size-adjust: 100%;
    }
    .ludica-risorse, .ludica-risorse *,
    .ludica-risorse *::before, .ludica-risorse *::after { box-sizing: border-box; }
    .ludica-risorse .lr-contenuto {
      display: flow-root; width: 100%; max-width: var(--larghezza-massima);
      margin-inline: auto; padding: var(--padding-pagina);
    }
    .ludica-risorse .lr-intestazione {
      margin-bottom: 28px; background: var(--sfondo-intestazione);
    }
    .ludica-risorse .lr-titolo-pagina {
      margin: 0 0 10px; color: var(--colore-titolo-pagina);
      font: 750 var(--testo-titolo-pagina)/1.2 var(--font); letter-spacing: -.03em;
    }
    .ludica-risorse .lr-introduzione {
      margin: 0; color: var(--colore-introduzione); font-size: var(--testo-introduzione);
    }
    /* 2. PANNELLO STRUMENTI: categorie prima, ricerca subito sotto. */
    .ludica-risorse .lr-strumenti {
      margin-bottom: 28px; padding: var(--padding-strumenti);
      background: var(--sfondo-strumenti); border: 1px solid var(--colore-bordo); border-radius: 18px;
    }
    .ludica-risorse .lr-filtri {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 22px;
    }
    .ludica-risorse .lr-filtro {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; max-width: 100%; margin: 0; padding: var(--padding-filtri);
      border: 1px solid var(--bordo-filtri); border-radius: var(--raggio-filtri);
      background: var(--sfondo-filtri); color: var(--colore-filtri);
      font: 600 var(--testo-filtri)/1.35 var(--font);
      text-transform: none; letter-spacing: normal; cursor: pointer; overflow-wrap: anywhere;
      box-shadow: var(--ombra-filtri);
      transition: background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .ludica-risorse .lr-filtro[aria-pressed="true"] {
      color: var(--colore-filtri-attivi); background: var(--sfondo-filtri-attivi);
      border-color: var(--bordo-filtri-attivi); box-shadow: var(--ombra-filtri-attivi);
    }
    .ludica-risorse .lr-filtro:active { transform: translateY(1px); }
    @media (hover: hover) {
      .ludica-risorse .lr-filtro:not([aria-pressed="true"]):hover {
        background: var(--sfondo-filtri-hover); color: var(--colore-filtri-hover);
        border-color: var(--bordo-filtri-hover); box-shadow: var(--ombra-filtri-hover);
        transform: translateY(-1px);
      }
    }
    .ludica-risorse .lr-label {
      display: block; margin: 0 0 8px; color: var(--colore-etichetta);
      font-size: var(--testo-etichetta); font-weight: 650;
    }
    .ludica-risorse .lr-ricerca {
      display: block; width: 100%; min-width: 0; min-height: 50px; margin: 0;
      padding: 13px 16px; border: 1px solid var(--colore-bordo); border-radius: 12px;
      background: var(--sfondo-ricerca); color: var(--colore-ricerca);
      font: 400 var(--testo-ricerca)/1.4 var(--font); box-shadow: none; appearance: none;
      transition: border-color .18s ease;
    }
    .ludica-risorse .lr-ricerca::placeholder { color: var(--colore-segnaposto); opacity: 1; }
    .ludica-risorse .lr-conteggio {
      margin: 12px 0 0; color: var(--colore-conteggio); font-size: var(--testo-conteggio);
    }
    /* 3. COLONNE RESPONSIVE: 1 mobile, 2 tablet, 3 o 4 desktop. */
    .ludica-risorse .lr-griglia {
      display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--spazio-griglia);
      margin: 0; padding: 0; list-style: none;
    }
    @media (min-width: 600px) {
      .ludica-risorse .lr-griglia { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 960px) {
      .ludica-risorse .lr-griglia { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1240px) {
      .ludica-risorse .lr-griglia { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .ludica-risorse .lr-elemento { display: flex; min-width: 0; margin: 0; padding: 0; list-style: none; }
    .ludica-risorse .lr-scheda {
      display: flex; flex-direction: column; align-items: flex-start;
      width: 100%; min-width: 0; padding: var(--padding-scheda);
      border: 1px solid var(--colore-bordo); border-radius: var(--raggio-scheda);
      background: var(--sfondo-scheda); overflow-wrap: anywhere;
      box-shadow: var(--ombra-scheda); transition: transform .2s ease, box-shadow .2s ease;
    }
    @media (hover: hover) {
      .ludica-risorse .lr-scheda:hover { transform: translateY(-3px); box-shadow: var(--ombra-scheda-hover); }
    }
    /* 4. REGOLA DEDICATA ALL'ANTEPRIMA.
       Modifica le variabili ANTEPRIMA nella sezione iniziale. */
    .ludica-risorse .lr-icona {
      display: flex; justify-content: center; align-items: center; flex-shrink: 0;
      align-self: var(--allineamento-anteprima);
      width: var(--larghezza-anteprima); max-width: 100%; height: var(--altezza-anteprima);
      margin: 0 0 22px; overflow: hidden; border: 1px solid var(--bordo-anteprima);
      border-radius: var(--raggio-anteprima); background: var(--sfondo-anteprima);
      color: var(--colore-icona-riserva); font-size: var(--testo-icona-riserva); line-height: 1;
    }
    .ludica-risorse .lr-icona img {
      display: block; width: 100%; height: 100%; min-width: 0;
      padding: var(--padding-immagine); object-fit: var(--adattamento-immagine);
      object-position: var(--posizione-immagine); border: 0; border-radius: 0; box-shadow: none;
    }
    .ludica-risorse .lr-badge {
      display: inline-block; max-width: 100%; margin: 0 0 12px; padding: 4px 10px;
      border-radius: 7px; background: var(--sfondo-badge); color: var(--colore-badge);
      font-size: var(--testo-badge); font-weight: 650; letter-spacing: .035em;
    }
    .ludica-risorse .lr-titolo {
      margin: 0 0 10px; color: var(--colore-titolo-scheda);
      font: 700 var(--testo-titolo-scheda)/1.35 var(--font); text-transform: none; letter-spacing: -.015em;
    }
    .ludica-risorse .lr-descrizione {
      margin: 0 0 24px; color: var(--colore-descrizione);
      font: 400 var(--testo-descrizione)/1.65 var(--font); white-space: pre-line;
    }
    .ludica-risorse .lr-link {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; max-width: 100%; margin-top: auto; padding: 10px 15px;
      border: 1px solid var(--sfondo-pulsante); border-radius: 10px;
      background: var(--sfondo-pulsante); color: var(--colore-pulsante);
      font: 650 var(--testo-pulsante)/1.4 var(--font); text-decoration: none;
      box-shadow: none; transition: background .18s ease, color .18s ease;
    }
    .ludica-risorse .lr-link:hover {
      background: var(--sfondo-pulsante-hover); border-color: var(--sfondo-pulsante-hover);
      color: var(--colore-pulsante-hover); text-decoration: none;
    }
    .ludica-risorse .lr-link-assente {
      margin-top: auto; color: var(--colore-link-assente); font-size: var(--testo-pulsante);
    }
    .ludica-risorse .lr-messaggio {
      margin: 18px 0; padding: 22px; border: 1px solid var(--colore-bordo); border-radius: 14px;
      background: var(--sfondo-messaggi); color: var(--colore-messaggi);
      font-size: var(--testo-messaggi); overflow-wrap: anywhere;
    }
    .ludica-risorse .lr-messaggio p { margin: 0 0 12px; }
    .ludica-risorse .lr-messaggio p:last-child { margin-bottom: 0; }
    .ludica-risorse .lr-azioni { display: flex; flex-wrap: wrap; gap: 8px; }
    .ludica-risorse .lr-riprova {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; max-width: 100%; margin: 0; padding: 10px 16px;
      border: 1px solid var(--colore-bordo); border-radius: 10px;
      background: var(--sfondo-riprova); color: var(--colore-riprova);
      font: 600 var(--testo-riprova)/1.4 var(--font); text-decoration: none;
      text-transform: none; letter-spacing: normal; cursor: pointer; overflow-wrap: anywhere;
    }
    .ludica-risorse .lr-riprova:hover { background: var(--sfondo-riprova-hover); }
    .ludica-risorse :is(input, button, a):focus-visible { outline: 3px solid var(--colore-focus); outline-offset: 4px; }
    .ludica-risorse [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      .ludica-risorse *, .ludica-risorse *::before, .ludica-risorse *::after {
        transition: none !important; animation: none !important;
      }
    }
  </style>
</head>
<body class="ludica-risorse">
  <main class="lr-contenuto" data-lr-gallery>
    <header class="lr-intestazione">
      <h1 class="lr-titolo-pagina">Esplora le risorse</h1>
      <p class="lr-introduzione">Cerca una risorsa o seleziona una tipologia.</p>
    </header>
    <section class="lr-strumenti" aria-label="Ricerca e filtri" hidden>
      <!-- Ordine reale nel documento: categorie, poi ricerca. -->
      <div class="lr-filtri" role="group" aria-label="Filtra per tipologia"></div>
      <label class="lr-label" for="lr-ricerca">Cerca nelle risorse</label>
      <input id="lr-ricerca" class="lr-ricerca" type="search"
        placeholder="Scrivi un titolo o una parola chiave…" autocomplete="off" enterkeyhint="search">
      <p class="lr-conteggio" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
    <div class="lr-messaggio" role="status" aria-live="polite" hidden></div>
    <ul class="lr-griglia" aria-label="Risorse" aria-busy="false"></ul>
    <noscript><p class="lr-messaggio">Abilita JavaScript per visualizzare la galleria.</p></noscript>
  </main>
  <script>
  (() => {
    "use strict";
    const root = document.querySelector("[data-lr-gallery]");
    if (!root) return;
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRnbHCs4ZDmMDJYRyP5vbQ4iY97UKBfe-_THwDbICkgeHy7plN96vXHZXzi1mvWsW5dtZBY1nfoN0sI/pub?gid=763305469&single=true&output=csv";
    const grid = root.querySelector(".lr-griglia");
    const tools = root.querySelector(".lr-strumenti");
    const search = root.querySelector(".lr-ricerca");
    const filters = root.querySelector(".lr-filtri");
    const count = root.querySelector(".lr-conteggio");
    const message = root.querySelector(".lr-messaggio");
    let resources = [], activeType = "", loading = false;
    const clean = value => String(value ?? "").trim();
    const normalize = value => clean(value).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    // Gestisce spazi finali, maiuscole e spazi in URL ICONA.
    const normalizeHeader = value => normalize(value).replace(/[^a-z0-9]/g, "");

    function make(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function webURL(value) {
      let text = clean(value);
      if (/^www\./i.test(text)) text = "https://" + text;
      if (text.startsWith("//")) text = "https:" + text;
      try {
        const url = new URL(text);
        return ["https:", "http:"].includes(url.protocol) ? url.href : null;
      } catch { return null; }
    }
    // URL ICONA: URL immagine, emoji o nome tra quelli elencati.
    // Supporta anche classi come "fa fa-book". Altri nomi usano 🔗.
    const iconNames = {
      book: "📚", libro: "📚", library: "📚", image: "🖼️", images: "🖼️", immagine: "🖼️",
      camera: "📷", video: "🎬", film: "🎬", music: "🎵", audio: "🎧", headphones: "🎧",
      globe: "🌐", web: "🌐", map: "🗺️", mappa: "🗺️", archive: "🗃️", archivio: "🗃️",
      database: "🗄️", file: "📄", "file-pdf": "📄", download: "⬇️", link: "🔗",
      landmark: "🏛️", university: "🏛️", museum: "🏛️", "graduation-cap": "🎓",
      tools: "🛠️", wrench: "🛠️", code: "💻", search: "🔎"
    };
    function createIcon(value) {
      const box = make("div", "lr-icona");
      box.setAttribute("aria-hidden", "true");
      const text = clean(value);
      let fallback = "🔗";
      for (const token of text.toLowerCase().split(/\s+/)) {
        const name = token.replace(/^(fa-|bi-|icon-)/, "");
        if (iconNames[name]) { fallback = iconNames[name]; break; }
      }
      if (text.length <= 20 && /\p{Extended_Pictographic}/u.test(text)) fallback = text;
      box.textContent = fallback;
      const url = webURL(text);
      if (url) {
        const img = document.createElement("img");
        img.alt = ""; img.loading = "lazy"; img.decoding = "async";
        img.referrerPolicy = "no-referrer";
        img.addEventListener("error", () => { box.textContent = fallback; }, { once: true });
        img.src = url;
        box.replaceChildren(img);
      }
      return box;
    }
    function createCard(item) {
      const li = make("li", "lr-elemento");
      const card = make("article", "lr-scheda");
      card.append(createIcon(item.icon), make("span", "lr-badge", item.type), make("h2", "lr-titolo", item.name));
      if (item.description) card.append(make("p", "lr-descrizione", item.description));
      const url = webURL(item.link);
      if (url) {
        const link = make("a", "lr-link", "Apri risorsa");
        link.href = url; link.target = "_blank"; link.rel = "noopener noreferrer";
        link.setAttribute("aria-label", "Apri " + item.name + " in una nuova scheda");
        const arrow = make("span", "", "↗"); arrow.setAttribute("aria-hidden", "true");
        link.append(arrow); card.append(link);
      } else card.append(make("span", "lr-link-assente", "Link non disponibile"));
      li.append(card); return li;
    }
    function showMessage(text, retry = false) {
      message.hidden = false;
      message.replaceChildren(make("p", "", text));
      if (retry) {
        const actions = make("div", "lr-azioni");
        const button = make("button", "lr-riprova", "Riprova");
        button.type = "button"; button.addEventListener("click", loadResources);
        const link = make("a", "lr-riprova", "Apri il CSV");
        link.href = CSV_URL; link.target = "_blank"; link.rel = "noopener noreferrer";
        actions.append(button, link); message.append(actions);
      }
      scheduleHeight();
    }
    function render() {
      const terms = normalize(search.value).split(/\s+/).filter(Boolean);
      const visible = resources.filter(item =>
        (!activeType || item.typeKey === activeType) && terms.every(term => item.searchText.includes(term))
      );
      const fragment = document.createDocumentFragment();
      visible.forEach(item => fragment.append(createCard(item)));
      grid.replaceChildren(fragment);
      count.textContent = visible.length + (visible.length === 1 ? " risorsa" : " risorse") + " su " + resources.length;
      if (!resources.length) showMessage("Il foglio non contiene risorse con il campo NOME compilato.");
      else if (!visible.length) showMessage("Nessun risultato. Modifica la ricerca o seleziona Tutti.");
      else message.hidden = true;
      scheduleHeight();
    }
    function buildFilters() {
      const types = new Map();
      resources.forEach(item => { if (!types.has(item.typeKey)) types.set(item.typeKey, item.type); });
      const options = [["", "Tutti"], ...Array.from(types.entries()).sort((a, b) => a[1].localeCompare(b[1], "it"))];
      filters.replaceChildren();
      options.forEach(([key, label]) => {
        const button = make("button", "lr-filtro", label);
        button.type = "button"; button.dataset.type = key;
        button.setAttribute("aria-pressed", String(key === activeType));
        button.addEventListener("click", () => {
          activeType = key;
          filters.querySelectorAll("button").forEach(other => {
            other.setAttribute("aria-pressed", String(other.dataset.type === activeType));
          });
          render();
        });
        filters.append(button);
      });
    }
    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          script.remove(); reject(new Error("Tempo scaduto durante il caricamento di PapaParse."));
        }, 12000);
        script.src = url; script.async = true;
        script.onload = () => {
          clearTimeout(timer); script.remove();
          if (window.Papa?.parse) resolve(window.Papa);
          else reject(new Error("PapaParse non disponibile."));
        };
        script.onerror = () => {
          clearTimeout(timer); script.remove(); reject(new Error("Caricamento di PapaParse bloccato."));
        };
        document.head.append(script);
      });
    }
    async function loadPapa() {
      if (window.Papa?.parse) return window.Papa;
      try { return await loadScript("https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"); }
      catch { return await loadScript("https://unpkg.com/papaparse@5.5.3/papaparse.min.js"); }
    }
    // Legge solo le cinque colonne richieste, anche se ne esistono altre vuote.
    function parseResources(Papa, csv) {
      if (/^\s*(<!doctype\s+html|<html)\b/i.test(csv)) {
        throw new Error("Google ha restituito HTML anziché CSV. Controlla la pubblicazione del foglio sul web.");
      }
      const parsed = Papa.parse(csv, { header: false, skipEmptyLines: "greedy", dynamicTyping: false });
      const quoteError = parsed.errors.find(error => error.type === "Quotes");
      if (quoteError) throw new Error("Virgolette non valide nel CSV: " + quoteError.message);
      const expected = ["nome", "descrizione", "tipo", "link", "urlicona"];
      const rows = parsed.data;
      const headerIndex = rows.findIndex(row => {
        const headers = row.map(normalizeHeader);
        return expected.every(name => headers.includes(name));
      });
      if (headerIndex < 0) {
        throw new Error("Intestazioni non riconosciute. Sono richieste NOME, DESCRIZIONE, TIPO, LINK e URL ICONA. Prima riga letta: " +
          (rows[0] || []).map(clean).filter(Boolean).join(" | "));
      }
      const headers = rows[headerIndex].map(normalizeHeader);
      const indexes = Object.fromEntries(expected.map(name => [name, headers.indexOf(name)]));
      const value = (row, name) => clean(row[indexes[name]]);
      return rows.slice(headerIndex + 1).filter(row => value(row, "nome")).map(row => {
        const name = value(row, "nome");
        const description = value(row, "descrizione");
        const type = value(row, "tipo") || "Senza categoria";
        return { name, description, type, typeKey: normalize(type),
          link: value(row, "link"), icon: value(row, "urlicona"),
          searchText: normalize(name + " " + description) };
      });
    }
    async function loadResources() {
      if (loading) return;
      loading = true; tools.hidden = true;
      grid.replaceChildren(); grid.setAttribute("aria-busy", "true");
      showMessage("Caricamento delle risorse…");
      try {
        const Papa = await loadPapa();
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 25000);
        let csv;
        try {
          // Richiede nuovamente il CSV a ogni caricamento della pagina.
          // I tempi di pubblicazione delle modifiche dipendono da Google.
          const response = await fetch(CSV_URL, { cache: "no-store", credentials: "omit", signal: controller.signal });
          if (!response.ok) throw new Error("Il CSV ha restituito un errore HTTP " + response.status + ".");
          csv = await response.text();
        } finally { clearTimeout(timer); }
        resources = parseResources(Papa, csv);
        activeType = ""; search.value = "";
        buildFilters(); tools.hidden = false; render();
      } catch (error) {
        console.error("[Galleria risorse]", error);
        let detail = error.message || String(error);
        if (error.name === "AbortError") detail = "Google non ha risposto entro 25 secondi.";
        else if (error instanceof TypeError) detail = "Il browser non riesce a scaricare il CSV. Verifica connessione, pubblicazione del foglio e possibili blocchi di rete o CORS.";
        showMessage("Impossibile caricare le risorse. " + detail, true);
      } finally {
        loading = false; grid.setAttribute("aria-busy", "false"); scheduleHeight();
      }
    }
    search.addEventListener("input", render);

    /* ALTEZZA IFRAME: compatibile con il ricevitore WordPress già fornito.
       Un iframe su un altro dominio richiede il ricevitore nella pagina padre. */
    let parentOrigin = null, heightFrame = 0, lastHeight = 0;
    try {
      const referrer = new URL(document.referrer);
      if (["https:", "http:"].includes(referrer.protocol)) parentOrigin = referrer.origin;
    } catch {}
    function sendHeight(force = false) {
      if (window.parent === window || !parentOrigin) return;
      const height = Math.ceil(root.getBoundingClientRect().height) + 2;
      if (!force && height === lastHeight) return;
      lastHeight = height;
      window.parent.postMessage({ type: "ludica-risorse:height", height }, parentOrigin);
    }
    function scheduleHeight() {
      cancelAnimationFrame(heightFrame);
      heightFrame = requestAnimationFrame(() => sendHeight());
    }
    window.addEventListener("message", event => {
      if (window.parent === window || event.source !== window.parent) return;
      if (event.data?.type !== "ludica-risorse:measure") return;
      if (!/^https?:\/\//i.test(event.origin)) return;
      if (parentOrigin && event.origin !== parentOrigin) return;
      parentOrigin = event.origin; sendHeight(true);
    });
    if ("ResizeObserver" in window) new ResizeObserver(scheduleHeight).observe(root);
    window.addEventListener("resize", scheduleHeight);
    window.addEventListener("load", scheduleHeight);
    root.addEventListener("load", scheduleHeight, true);
    loadResources();
  })();
  </script>
